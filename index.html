<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vue Template</title>
    <!-- Import Styles -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/styles.css" />
    <!-- Import Vue.js -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Import axios.js -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>
  <body>
  <div id="app">
    <div class="nav-bar"></div>

      <h1>{{ intro }}</h1>

      <Foodsearchbar @barcode="recieveBarcode"></Foodsearchbar>
      <inhold v-if="barcode" :barcode="barcode" @product-info="updateproductInfo"></inhold>
      <p v-if="productInfo">Product Info: {{ productInfo.calories }}</p>
      <p>Current Weight: {{ weight }}</p>
      <p>Current Protein: {{ protein }}</p>
      <p>Current Fat: {{ fat }}</p>
      <p>Current Carbohydrate: {{ carbohydrate }}</p>
      <Weight @weight-updated="updateWeight"></Weight>
   </div>

    <!-- Import App -->
    <script src="./js/main.js"></script>
    <script src="./components/Food_Searchbar.js"></script>

     <!-- Import Components -->
    <script src="./components/Inhold.js"></script>
    <script src="./components/Weight.js"></script>

    <!-- Mount App -->
    <script>
      const mountedApp = app.mount('#app')
    </script>
  </body>
</html>
